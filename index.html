<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 1 - Cognifyz Tasks</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; text-align: center; background-color: #fcfcfc; }
        nav { background: #0056b3; padding: 10px; }
        nav a { margin: 0 10px; text-decoration: none; color: white; font-weight: bold; }
        .box { background: white; padding: 20px; margin: 15px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #colorBtn { padding: 12px 24px; font-size: 16px; border: none; background-color: #28a745; color: white; border-radius: 4px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 80px; text-align: center; }
    </style>
</head>
<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
    </nav>

    <div class="box">
        <h1>Welcome to My Level 1 Tasks</h1>
        <p>This page demonstrates basic HTML structure, form elements, and style rules.</p>
        <img src="https://picsum.photos/200" alt="Sample Image" style="border-radius: 8px;">
        
        <form onsubmit="event.preventDefault(); alert('Form submitted!');" style="margin-top: 15px;">
            <input type="text" placeholder="Your Name" style="width: 150px;">
            <button type="submit">Submit</button>
        </form>
    </div>

    <div class="box">
        <h3>Task 2: JavaScript Features</h3>
        <button id="colorBtn">Tap to Change My Color</button>
        
        <div style="margin-top: 25px;">
            <h5>Simple Mobile Calculator</h5>
            <input type="number" id="n1" placeholder="Num 1"> +
            <input type="number" id="n2" placeholder="Num 2">
            <br>
            <button onclick="calc()" style="margin-top: 10px; padding: 6px 15px;">Add Numbers</button>
            <p style="font-weight: bold; margin-top: 10px;">Result: <span id="res">0</span></p>
        </div>
    </div>

    <script>
        // Time-based greeting alert
        window.onload = function() {
            let hr = new Date().getHours();
            let msg = hr < 12 ? "Good Morning!" : hr < 18 ? "Good Afternoon!" : "Good Evening!";
            alert(msg + " Welcome to my mobile submission.");
        };

        // Random Color Button Generator
        document.getElementById('colorBtn').addEventListener('click', function() {
            let colors = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33F3', '#33FFF0'];
            this.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        });

        // Addition logic
        function calc() {
            let a = parseFloat(document.getElementById('n1').value) || 0;
            let b = parseFloat(document.getElementById('n2').value) || 0;
            document.getElementById('res').innerText = a + b;
        }
    </script>
</body>
</html>
