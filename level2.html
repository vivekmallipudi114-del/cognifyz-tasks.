<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 2 - Responsive Framework</title>
    <!-- Importing Bootstrap layout via CDN link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom Media Query Requirement */
        @media (max-width: 768px) {
            body { background-color: #f1f3f5; }
            .display-4 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- Responsive Navigation with Mobile Burger Icon Toggle -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Cognifyz Grid</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContainer">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContainer">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Bootstrap Responsive Grid Component -->
    <div class="container my-5">
        <h2 class="text-center mb-4 display-4">Responsive Framework Elements</h2>
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <img src="https://picsum.photos/400/250?random=1" class="card-img-top" alt="Card Image">
                    <div class="card-body">
                        <h5 class="card-title">Responsive Cards</h5>
                        <p class="card-text">Adapts design gracefully based on target screens.</p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <img src="https://picsum.photos/400/250?random=2" class="card-img-top" alt="Card Image">
                    <div class="card-body">
                        <h5 class="card-title">Grid Breakpoints</h5>
                        <p class="card-text">Stacks rows vertically on narrow smartphone devices automatically.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
